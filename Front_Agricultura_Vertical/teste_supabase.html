<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste Supabase</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h2>Teste de conexão com Supabase</h2>
  <p id="resultado">Verificando conexão...</p>

  <script>
    const SUPABASE_URL = 'SUA_URL';
    const SUPABASE_KEY = 'SUA_CHAVE_PUBLICA';

    const cliente = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function testarConexao() {
      try {
        const { error } = await cliente.auth.getSession();

        if (error) throw error;

        document.getElementById('resultado').textContent =
          'Conexão com o Supabase estabelecida!';

      } catch (erro) {
        document.getElementById('resultado').textContent =
          'Não foi possível conectar: ' + erro.message;
      }
    }

    testarConexao();
  </script>
</body>
</html>
